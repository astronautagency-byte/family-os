name: Build FamOS for the iOS App Store

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Next unused iOS build suffix (for example, 9 for 1.0.0.9)
        required: true
        type: string
      upload:
        description: Sign and upload to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_DEVELOPMENT_TEAM: ZRDVT9WBN4
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: llvm-tools

      - name: Check release inputs
        run: |
          [[ "$APP_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Enter a positive integer build suffix"; exit 1; }
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Set the public Supabase build variables"; exit 1; }
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "${sdk_version%%.*}" -ge 26 ]] || { echo "App Store uploads require iOS SDK 26 or later"; exit 1; }

      - name: Install dependencies
        run: |
          brew install xcodegen
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          npm ci

      - name: Prepare iOS project
        run: npm run mobile:ios:prepare

      - name: Create unsigned archive
        if: ${{ !inputs.upload }}
        run: npx --no-install tauri ios build --archive-only --no-sign --build-number "$APP_BUILD_NUMBER" --ci

      - name: Export and upload signed iOS build
        if: ${{ inputs.upload }}
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          for name in IOS_CERTIFICATE IOS_MOBILE_PROVISION APPLE_API_KEY APPLE_API_ISSUER APP_STORE_CONNECT_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing required signing or upload credential: $name"; exit 1; }
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          export APPLE_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          npx --no-install tauri ios build --export-method app-store-connect --build-number "$APP_BUILD_NUMBER" --ci
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Save unsigned archive
        if: ${{ !inputs.upload }}
        run: |
          archive=src-tauri/gen/apple/build/famos_iOS.xcarchive
          app="$archive/Products/Applications/FamOS.app"
          test -f "$app/PrivacyInfo.xcprivacy"
          test ! -e "$app/libapp.a"
          ditto -c -k --keepParent "$archive" "$RUNNER_TEMP/FamOS-iOS.xcarchive.zip"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: FamOS-iOS-unsigned
          path: ${{ runner.temp }}/FamOS-iOS.xcarchive.zip
          if-no-files-found: error
