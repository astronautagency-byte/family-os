<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="FamOS privacy policy for the private family coordination app, including Google Calendar sync, household data, Fam AI, invitations, and user controls." />
    <link rel="canonical" href="https://fam-os.app/privacy" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <title>Privacy Policy | FamOS</title>
    <style>
      :root { color-scheme: light; --ink:#17172f; --soft:#5f5a68; --accent:#7952e8; --line:#ded8f0; --paper:#fff; --canvas:#fbf7ff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--canvas); color:var(--ink); }
      main { width:min(860px, calc(100% - 36px)); margin:0 auto; padding:48px 0 72px; }
      nav, footer { width:min(860px, calc(100% - 36px)); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 0; }
      a { color:var(--accent); font-weight:800; text-decoration:none; }
      a:hover { text-decoration:underline; text-underline-offset:4px; }
      .brand { display:flex; align-items:center; gap:12px; color:var(--ink); font-weight:900; font-size:22px; }
      .brand img { width:46px; height:46px; object-fit:contain; }
      .brand span span { color:var(--accent); }
      .hero, section, aside { background:var(--paper); border:1px solid var(--line); border-radius:26px; box-shadow:0 14px 34px rgba(47, 39, 77, .07); }
      .hero { padding:40px; margin-bottom:18px; }
      .hero p:first-child, h2 { color:var(--accent); font-size:12px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; margin:0 0 12px; }
      h1 { margin:0 0 16px; font-size:clamp(42px, 7vw, 72px); line-height:.95; letter-spacing:-.055em; }
      .hero > p:last-child { max-width:680px; color:var(--soft); font-size:18px; line-height:1.65; margin:0; }
      section, aside { padding:28px; margin-top:16px; }
      h2 { color:var(--ink); font-size:22px; letter-spacing:-.015em; text-transform:none; }
      p, li { color:var(--soft); line-height:1.65; }
      ul { padding-left:22px; }
      footer { color:var(--soft); font-size:13px; border-top:1px solid var(--line); }
      @media (max-width: 640px) { nav, footer { align-items:flex-start; flex-direction:column; } .hero, section, aside { padding:24px; border-radius:22px; } }
    </style>
  </head>
  <body>
    <nav>
      <a class="brand" href="/" aria-label="FamOS home"><img src="/icons/icon-512.png" alt="" /><span>Fam<span>OS</span></span></a>
      <span><a href="/">Home</a> · <a href="/terms">Terms</a></span>
    </nav>
    <main></main>
    <footer>
      <span>Developed by the team at Astronaut Digital · Part of Astronaut Ventures</span>
      <span>© 2026 FamOS. All rights reserved.</span>
    </footer>
  </body>
</html>
